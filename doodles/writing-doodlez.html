  <style>
    .content-box {
      max-width: 650px;
      margin: 60px auto;
      padding: 12px;
      background-color: rgba(196, 196, 196, 1); /* Semi-transparent dark box */
      border-radius: 1px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
	
	.center-text
	{
		text-align: center;
	}
	
	.text-big
	{

	}
	
	.text-medium
	{

	}
	
	.text-small
	{

	}
	
	.text-tiny
	{

	}
	
		.image-container {
	  max-width: 244px;
	  margin: 20px auto; /* Adds space between your text box and the image */
	  text-align: center; /* Centers the image horizontally */
	}

	/* Make sure the image doesn't overflow small screens */
	.image-container img {
	  max-width: 100%;
	  height: auto;
	  border-radius: 3px; /* Optional: gives the image smooth rounded corners */
	  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); /* Optional: dark drop shadow */
	}
	
	.color-yt

	}

	}
	
	a
	{
		text-decoration: none;
		color: #FFFFEB;
	}
	
	a:hover
	{
		color: #FFFFFF;
		font-weight: bold;
	}
	
	.tooltip
	{
		position: relative;
		cursor: pointer;
	}

.tooltip-text
{
	visibility: hidden;
	opacity: 0;
	position: absolute;
	bottom: 125%;
	left: 50%;
	transform: translateX(-50%);
	background-color: #222;
	color: #fff;
	padding: 6px 10px;
	border-radius: 2px;
	white-space: nowrap;
	font-size: 0.85em;
	transition: opacity 1.5s ease;
	z-index: 10;
}

.tooltip:hover .tooltip-text {
	visibility: visible;
	opacity: 1;
}
	
</style>
